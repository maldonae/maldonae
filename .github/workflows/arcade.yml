name: Generate Arcade Animations

on:
  schedule:
    - cron: "41 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man and Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,tetris"
          hide_month_labels: "false"

      - name: Publish animations to arcade branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: arcade
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
