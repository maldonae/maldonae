name: Update GitHub Stats

on:
  # Mise à jour quotidienne à 03:17 UTC
  schedule:
    - cron: "17 3 * * *"

  # Permet aussi de lancer la génération manuellement
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=maldonae&show_icons=true&include_all_commits=true&theme=tokyonight&hide_border=true&card_width=500
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=maldonae&layout=donut&theme=tokyonight&hide_border=true
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit and push generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub stats cards"
            git push
          fi
